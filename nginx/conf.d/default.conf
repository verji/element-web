server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Set no-cache for the version, config and index.html
    # so that browsers always check for a new copy of Element Web.
    # NB http://your-domain/ and http://your-domain/? are also covered by this

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version {
        add_header Cache-Control "no-cache";
    }
    # covers config.json and config.hostname.json requests as it is prefix.
    location /config {
        add_header Cache-Control "no-cache";
    }

    # VERJI: Apple requires apple-app-site-association to be served as application/json.
    # The file deliberately has no extension, so nginx would otherwise fall back to
    # application/octet-stream and iOS would reject it. Served from both the documented
    # .well-known path and the legacy root path.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }
    location = /apple-app-site-association {
        default_type application/json;
    }
    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
}

